apiVersion: skaffold/v2beta26
kind: Config
metadata:
  name: judge-k8s
build:
  artifacts:
    - image: skaffold-dev:34751/judge-k8s
      # - image: k3d-skaffold-dev:5000/judge-k8s
      ko:
        dir: .
        env:
          - CGO_ENABLED=0
        flags:
          - -trimpath
        ldflags:
          - -extldflags "-static"
  local:
    concurrency: 5
    tryImportMissing: false
    useDockerCLI: false
    push: true

deploy:
  kubectl:
    manifests:
      - dev/k8s/judge-k8s-webhook.yaml
      - dev/k8s/webhook-server-tls.yaml
      - dev/k8s/redis.yaml
      - dev/k8s/mysql.yaml
